services:
  - type: web
    name: realestate-hub-ai
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: VAPI_PRIVATE_KEY
        sync: false
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: realestate-db
          property: connectionString

databases:
  - name: realestate-db
    plan: free
    region: oregon
    databaseName: realestate_kb
    user: postgres
